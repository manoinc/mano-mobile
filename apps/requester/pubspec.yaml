name: mano_requester
description: >
  Mano for Solicitantes: the app for people who need work done in their home.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.2

# Screens and routing only. Anything this app learns about Mano, it learns
# through mano_session; anything it draws, it draws with mano_ui.
dependencies:
  flutter:
    sdk: flutter
  # Holds the system splash up until Flutter has painted, so the m never
  # flickers through a blank window on its way into the opening animation.
  flutter_native_splash: ^2.4.8
  mano_session: ^0.1.0
  mano_ui: ^0.1.0
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/
