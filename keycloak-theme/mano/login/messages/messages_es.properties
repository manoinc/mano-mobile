# ── Páginas de error ─────────────────────────────────────────────────────
# Keycloak encabeza sus errores con "Lo sentimos...". Un error no pide
# disculpas: dice qué pasó y qué sigue. El encabezado nombra el problema y el
# cuerpo da la salida.
errorTitle=Algo no salió bien
