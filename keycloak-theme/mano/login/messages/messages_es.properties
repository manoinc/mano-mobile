invalidPasswordMessage=Esos datos no coinciden. Revisa tu correo y tu contraseña.
missingUsernameMessage=Escribe tu correo o usuario.
missingPasswordMessage=Escribe tu contraseña.
missingEmailMessage=Escribe tu correo.
missingFirstNameMessage=Escribe tu nombre.
