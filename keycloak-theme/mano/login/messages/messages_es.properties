# Mano — textos en español para el flujo de autenticación.
#
# Se sobreponen a los de Keycloak, que están traducidos de forma literal desde
# el inglés y suenan a sistema ("Iniciar sesión en su cuenta"). Aquí se escribe
# como habla Mano: tuteo, frases cortas, verbos activos, y una acción conserva
# su nombre de principio a fin -- el botón dice "Iniciar sesión" y la app dice
# lo mismo.
#
# Los errores dicen qué pasó y qué hacer, no piden disculpas ni culpan a nadie.

