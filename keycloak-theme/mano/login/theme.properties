# Mano's login theme.
#
# parent=keycloak.v2 rather than base: inheriting the stock theme means every
# page Keycloak can render -- OTP, password reset, required actions, consent,
# errors, account linking -- is branded by the same stylesheet. A theme that
# only styled login.ftl would hand the user a Mano page followed by a stranger's
# page the first time anything unusual happened.
parent=keycloak.v2
import=common/keycloak

# The parent's stylesheet loads first; ours overrides it.
styles=css/styles.css css/mano.css

# The brand is light-first, but people run their phones dark. Both grounds are
# derived from the same tokens rather than invented, so flame reads identically
# on either.
darkMode=true
