name: mano_data
description: >
  Adapters implementing the ports declared by mano_domain: credential storage
  the SuperTokens session adapter and the GraphQL transport to mano-gateway.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

# This package depends on Flutter, and that is not a violation of the
# boundary. Adapters exist precisely to know about infrastructure -- here,
# plugins that need platform channels. What matters is the direction of the
# arrow: mano_data depends on mano_domain and never the reverse, so the domain
# stays ignorant of everything below.
dependencies:
  flutter:
    sdk: flutter
  mano_domain: ^0.1.0

  # Refresh tokens belong in the Keystore/Keychain, not SharedPreferences.
  # Kept regardless of which auth provider lands: whatever it is, a token
  # worth remembering across launches is worth storing securely.
  flutter_secure_storage: ^11.0.0

  # GraphQL transport. No GraphQL client library yet, deliberately: there is
  # one query and no agreed schema, so committing to a client and its cache
  # would be a guess. Revisit when the schema lands.
  http: ^1.2.0

  # graphql-transport-ws subscriptions (chat's messageAdded).
  stream_channel: ^2.1.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
